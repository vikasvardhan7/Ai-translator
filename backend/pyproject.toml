[project]
name = "ai-translator-backend"
version = "0.1.0"
description = "Backend for the AI two-way real-time voice translator"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
